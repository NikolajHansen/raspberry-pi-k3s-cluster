name: Build Lyrion image

on:
  workflow_dispatch:
  push:
    paths:
      - docker/lyrion/**
      - .github/workflows/lyrion-image.yml

env:
  LMS_VERSION: "9.1.2"
  IMAGE: ghcr.io/nikolajhansen/lyrion

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/lyrion
          platforms: linux/arm64
          build-args: LMS_VERSION=${{ env.LMS_VERSION }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.LMS_VERSION }}-tools
