---
# One-shot migration: move greenlake/logs/k3s-cluster → greenlake/k3s/logs
# so all k3s ZFS datasets live under the single greenlake/k3s root.
#
# Safe to run while syslog-ng is live — syslog-ng will miss writes for the
# few seconds the nullfs is unmounted and remounted (no data loss on atlas).
#
# Run with: k3s-ansible atlas-logs-migrate.yml
# Or directly:
#   ansible-playbook -i ansible/inventory/groups.yml -i ~/k3s-inventory.yml \
#     -e @~/k3s-site.yml ansible/playbooks/atlas-logs-migrate.yml

- name: Migrate syslog ZFS dataset to greenlake/k3s/logs
  hosts: atlas
  become: true  # Pass --ask-become-pass or set ansible_become_password in ~/k3s-site.yml
  gather_facts: false
  vars:
    old_dataset: greenlake/logs/k3s-cluster
    new_dataset: greenlake/k3s/logs
    new_mount: /greenlake/k3s/logs
    jail_root: "/area51/jails/syslog.{{ internal_domain }}"
    jail_fstab: "{{ jail_root }}/etc/fstab"

  tasks:
    - name: Check if old dataset still exists
      ansible.builtin.command:
        cmd: zfs list {{ old_dataset }}
      register: old_exists
      failed_when: false
      changed_when: false

    - name: Skip migration if old dataset is already gone
      ansible.builtin.meta: end_play
      when: old_exists.rc != 0

    - name: Unmount nullfs from syslog jail
      ansible.builtin.command:
        cmd: umount {{ jail_root }}/mnt/logs
      failed_when: false

    - name: Rename ZFS dataset (data stays in place)
      ansible.builtin.command:
        cmd: zfs rename {{ old_dataset }} {{ new_dataset }}

    - name: Verify new mountpoint
      ansible.builtin.command:
        cmd: zfs list {{ new_dataset }}
      changed_when: false

    - name: Update jail fstab to use new path
      ansible.builtin.replace:
        path: "{{ jail_fstab }}"
        regexp: '^/greenlake/logs/k3s-cluster(\s+)'
        replace: '{{ new_mount }}\1'

    - name: Remount nullfs into jail
      ansible.builtin.command:
        cmd: mount -t nullfs {{ new_mount }} {{ jail_root }}/mnt/logs

    - name: Destroy empty greenlake/logs parent dataset
      community.general.zfs:
        name: greenlake/logs
        state: absent

    - name: Verify syslog-ng is still listening on 514
      ansible.builtin.command:
        cmd: sockstat -l
      register: sockstat_out
      changed_when: false
      failed_when: "'514' not in sockstat_out.stdout"
