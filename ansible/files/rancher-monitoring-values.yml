prometheus:
  prometheusSpec:
    resources:
      limits:
        memory: 3000Mi
      requests:
        memory: 750Mi

prometheus-adapter:
  resources:
    limits:
      cpu: 500m
      memory: 700Mi
    requests:
      cpu: 100m
      memory: 256Mi

grafana:
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth:
      disable_login_form: false
