prometheus:
  prometheusSpec:
    resources:
      limits:
        memory: 3000Mi
      requests:
        memory: 750Mi

prometheus-adapter:
  resources:
    limits:
      cpu: 750m
      memory: 700Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Reduce Prometheus query frequency — serves from cache between relistings.
  # Default is 1m which hammers Prometheus on every kube-apiserver discovery poll.
  metricsRelistInterval: 10m
  # Narrow rules to empty set — no HPAs in use so no need to expose custom metrics.
  # This makes discovery responses trivially fast (empty list) rather than
  # querying thousands of container_* series on every poll.
  rules:
    default: false
    custom: []
    external: []
    resource: {}

prometheus-node-exporter:
  prometheus:
    monitor:
      relabelings:
        # Replace IP:port instance label with node FQDN for all dashboards
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
          regex: (.+)
        # Also add a node label so node=~"$Node" filters work on node_* metrics
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          regex: (.+)

grafana:
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth:
      disable_login_form: false
