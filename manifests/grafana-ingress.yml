apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: cattle-monitoring-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: grafana.barnabas.dk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rancher-monitoring-grafana
                port:
                  number: 80
